# Nginx configuration for Sentinel Video Audit Dashboard
# Designed for high-resolution, multi-minute video uploads up to 500MB without timeouts

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 500MB upload body limit to prevent HTTP 413 (Payload Too Large)
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Extended timeout thresholds to prevent HTTP 504 Gateway Timeouts
    client_body_timeout 300s;
    client_header_timeout 300s;
    keepalive_timeout 300s;
    send_timeout 300s;

    # Upstream Next.js frontend / API gateway
    upstream nextjs_upstream {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # Upstream Python FastAPI video ingestion & processing pipeline
    upstream backend_upstream {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Disable proxy request buffering for streaming video uploads
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Global Proxy Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # FastAPI Direct Backend Endpoints
        location /api/py/ {
            rewrite ^/api/py/(.*) /api/$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE streaming support
            proxy_set_header Cache-Control "no-cache";
            proxy_read_timeout 600s;
        }

        # Next.js Application & API Gateway
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
